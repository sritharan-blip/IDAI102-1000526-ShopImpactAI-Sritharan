# Copy into Streamlit App Settings > Secrets, or into .streamlit/secrets.toml for local testing.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "GENERATE-A-RANDOM-SECRET"
client_id = "YOUR-GOOGLE-OAUTH-CLIENT-ID"
client_secret = "YOUR-GOOGLE-OAUTH-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid profile email", prompt = "select_account" }

[cloud]
dsn = "postgresql://USER:PASSWORD@HOST/DATABASE"
